name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor
      - run: pnpm test:db
      - run: pnpm --filter shatsu-ren-tests test:db
      - run: pnpm build
      - run: pnpm zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: apps/extension/.output/*.zip
      # 브라우저 E2E(Chromium↔Aside) 는 Aside 가 필요해 CI 에서 실행하지 않는다. 로컬 절차: CONTRIBUTING.md
